<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Daily Grind Café - Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col justify-between font-sans pt-12">

  <!-- Header -->
  <header class="bg-amber-900 text-amber-100 shadow-md py-4 px-6 flex justify-between items-center fixed top-0 left-0 right-0 z-40">
    <div class="text-xl font-bold tracking-wider flex items-center gap-2">
      <span>☕</span> The Daily Grind Café
    </div>
    <nav class="space-x-6 text-sm font-medium">
      <a href="index.html" class="hover:text-amber-300 transition">Home</a>
      <a href="menu.html" class="underline underline-offset-4">Menu</a>
      <a href="cart.html" class="hover:text-amber-300 transition flex items-center gap-1 inline-flex">
        Cart <span id="cart-badge" class="bg-amber-700 text-white text-xs px-2 py-0.5 rounded-full">0</span>
      </a>
      <a href="track.html" class="hover:text-amber-300 transition">Track Order</a>
      <a href="staff-login.html" class="hover:text-amber-300 transition">Staff</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-8 mb-24">
    
    <!-- Title & Filters -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-amber-900 mb-2">Our Artisan Menu</h1>
      <p class="text-amber-800/80 text-sm">Select your favorite treats and build your order.</p>
    </div>

    <div id="category-filters" class="flex flex-wrap justify-center gap-2 mb-8">
      <button onclick="filterCategory('All')" class="category-btn px-4 py-2 rounded-xl text-sm font-medium bg-amber-800 text-white shadow transition">All</button>
      <button onclick="filterCategory('Coffees')" class="category-btn px-4 py-2 rounded-xl text-sm font-medium bg-white text-amber-900 border border-amber-200 hover:bg-amber-100 transition">Coffees</button>
      <button onclick="filterCategory('Waffles')" class="category-btn px-4 py-2 rounded-xl text-sm font-medium bg-white text-amber-900 border border-amber-200 hover:bg-amber-100 transition">Waffles</button>
      <button onclick="filterCategory('Cakes')" class="category-btn px-4 py-2 rounded-xl text-sm font-medium bg-white text-amber-900 border border-amber-200 hover:bg-amber-100 transition">Cakes</button>
      <button onclick="filterCategory('Biscuits')" class="category-btn px-4 py-2 rounded-xl text-sm font-medium bg-white text-amber-900 border border-amber-200 hover:bg-amber-100 transition">Biscuits</button>
    </div>

    <!-- Menu Grid -->
    <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
      <!-- Loaded dynamically -->
    </div>
  </main>

  <!-- Floating Cart Bar -->
  <div id="floating-cart-bar" class="fixed bottom-0 left-0 right-0 bg-amber-950 text-amber-100 py-4 px-6 shadow-2xl z-45 flex justify-between items-center max-w-4xl mx-auto md:rounded-t-2xl border-t border-amber-800" style="display: none;">
    <div>
      <span id="cart-count-summary" class="font-bold text-amber-300">0 items</span> selected 
      <span class="mx-2">•</span> 
      Subtotal: <strong id="cart-subtotal-summary" class="text-amber-200">$0.00</strong>
    </div>
    <a href="cart.html" class="bg-amber-600 hover:bg-amber-500 text-white px-6 py-2.5 rounded-xl font-semibold shadow transition flex items-center gap-2">
      View Cart & Checkout ➔
    </a>
  </div>

  <!-- Footer -->
  <footer class="bg-amber-950 text-amber-300/60 py-4 text-center text-xs">
    &copy; 2026 The Daily Grind Café. Freshly brewed with love.
  </footer>

  <script src="api.js"></script>
  <script src="app.js"></script>
  <script>
    let menuItems = [];
    let cart = JSON.parse(localStorage.getItem('cafe_cart')) || {};

    async function fetchMenu() {
      try {
        const res = await fetch(`${API_BASE}/menu`);
        const data = await res.json();
        if (data.success) {
          menuItems = data.menu;
          renderMenu('All');
          updateCartUI();
        }
      } catch (err) {
        console.error('Failed to load menu:', err);
        document.getElementById('menu-grid').innerHTML = `<p class="col-span-3 text-center text-red-600">Failed to connect to backend server. Make sure cafe-be is running on port 5000.</p>`;
      }
    }

    function filterCategory(category) {
      document.querySelectorAll('.category-btn').forEach(btn => {
        if (btn.textContent.trim() === category) {
          btn.className = 'category-btn px-4 py-2 rounded-xl text-sm font-medium bg-amber-800 text-white shadow transition';
        } else {
          btn.className = 'category-btn px-4 py-2 rounded-xl text-sm font-medium bg-white text-amber-900 border border-amber-200 hover:bg-amber-100 transition';
        }
      });
      renderMenu(category);
    }

    function renderMenu(category) {
      const grid = document.getElementById('menu-grid');
      const filtered = category === 'All' ? menuItems : menuItems.filter(i => i.category === category);
      
      grid.innerHTML = filtered.map(item => {
        const qty = cart[item.id] ? cart[item.id].quantity : 0;
        return `
          <div class="bg-white rounded-2xl p-5 shadow-md border border-amber-200 flex flex-col justify-between">
            <div>
              <div class="text-4xl mb-3">${item.image}</div>
              <div class="flex justify-between items-start mb-1">
                <h3 class="font-bold text-lg text-amber-900">${item.name}</h3>
                <span class="text-amber-700 font-semibold">$${item.price.toFixed(2)}</span>
              </div>
              <p class="text-xs text-amber-700/80 mb-4">${item.description}</p>
            </div>
            <div>
              <div class="flex items-center justify-between mb-3 text-xs text-amber-800 font-medium bg-amber-50 px-3 py-1.5 rounded-lg border border-amber-100">
                <span>Prep Time:</span>
                <span class="font-bold">⏱️ ${item.prepTime}s</span>
              </div>
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2 border border-amber-200 rounded-lg overflow-hidden">
                  <button onclick="updateQty('${item.id}', -1)" class="px-3 py-1 bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold transition">-</button>
                  <span id="qty-${item.id}" class="px-2 font-semibold text-amber-900">${qty}</span>
                  <button onclick="updateQty('${item.id}', 1)" class="px-3 py-1 bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold transition">+</button>
                </div>
                <button onclick="addToCart('${item.id}')" class="bg-amber-800 hover:bg-amber-900 text-white text-xs px-4 py-2 rounded-lg font-medium shadow transition">
                  ${qty > 0 ? 'Update' : 'Add to Cart'}
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateQty(id, change) {
      if (!cart[id]) {
        if (change > 0) {
          const item = menuItems.find(i => i.id === id);
          cart[id] = { ...item, quantity: 1 };
        }
      } else {
        cart[id].quantity += change;
        if (cart[id].quantity <= 0) {
          delete cart[id];
        }
      }
      
      const qtySpan = document.getElementById(`qty-${id}`);
      if (qtySpan) {
        qtySpan.textContent = cart[id] ? cart[id].quantity : 0;
      }
      
      localStorage.setItem('cafe_cart', JSON.stringify(cart));
      updateCartUI();
    }

    function addToCart(id) {
      if (!cart[id]) {
        const item = menuItems.find(i => i.id === id);
        cart[id] = { ...item, quantity: 1 };
      }
      localStorage.setItem('cafe_cart', JSON.stringify(cart));
      updateCartUI();
      renderMenu(document.querySelector('.category-btn.bg-amber-800')?.textContent.trim() || 'All');
    }

    function updateCartUI() {
      let totalCount = 0;
      let subtotal = 0;
      
      Object.values(cart).forEach(item => {
        totalCount += item.quantity;
        subtotal += item.price * item.quantity;
      });

      document.getElementById('cart-badge').textContent = totalCount;
      
      const floatingBar = document.getElementById('floating-cart-bar');
      if (totalCount > 0) {
        floatingBar.style.display = 'flex';
        document.getElementById('cart-count-summary').textContent = `${totalCount} item${totalCount > 1 ? 's' : ''}`;
        document.getElementById('cart-subtotal-summary').textContent = `$${subtotal.toFixed(2)}`;
      } else {
        floatingBar.style.display = 'none';
      }
    }

    window.addEventListener('DOMContentLoaded', fetchMenu);
  </script>
</body>
</html>
