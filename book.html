<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserve Table - The Daily Grind Cafe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-amber-50 min-h-screen font-sans">
  <header class="bg-amber-900 text-amber-100 shadow-md py-4 px-6 flex justify-between items-center fixed top-0 left-0 right-0 z-40">
    <div class="text-xl font-bold tracking-wider flex items-center gap-2"><span></span> The Daily Grind Cafe</div>
    <nav class="space-x-6 text-sm font-medium">
      <a href="index.html" class="hover:text-amber-300 transition">Home</a>
      <a href="menu.html" class="hover:text-amber-300 transition">Menu</a>
      <a href="book.html" class="underline underline-offset-4">Book Table</a>
    </nav>
  </header>

  <main class="max-w-lg mx-auto px-4 py-20">
    <div class="bg-white rounded-2xl shadow-lg border border-amber-200 p-6 space-y-4">
      <h1 class="text-2xl font-bold text-amber-900">Reserve a Table</h1>
      <form id="book-form" class="space-y-3">
        <input id="guestName" class="w-full border border-amber-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 bg-amber-50" placeholder="Guest name" required>
        <input id="phone" class="w-full border border-amber-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 bg-amber-50" placeholder="Phone (optional)">
        <input id="partySize" class="w-full border border-amber-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 bg-amber-50" type="number" min="1" max="12" value="2" required placeholder="Party size">
        <input id="tableNumber" class="w-full border border-amber-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 bg-amber-50" type="number" min="1" max="12" placeholder="Preferred table no. (optional)">
        <input id="expectedArrival" class="w-full border border-amber-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 bg-amber-50" type="datetime-local" required>
        <textarea id="notes" class="w-full border border-amber-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 bg-amber-50" rows="2" placeholder="Dietary notes (optional)"></textarea>
        <button type="submit" class="bg-amber-800 hover:bg-amber-900 text-white w-full py-3 rounded-xl font-semibold">Reserve Now</button>
      </form>
      <p id="book-error" class="text-red-600 text-sm hidden"></p>
      <div id="confirm-card" class="hidden bg-emerald-50 border border-emerald-200 rounded-xl p-4 text-sm text-emerald-900 space-y-2">
        <h2 class="font-bold text-emerald-700">Booking Confirmed!</h2>
        <div><strong>Code:</strong> <span id="code-val"></span></div>
        <div><strong>Table:</strong> <span id="code-table"></span></div>
        <div><strong>Guest:</strong> <span id="code-guest"></span></div>
        <div><strong>Expected:</strong> <span id="code-time"></span></div>
      </div>
      <a id="order-here" class="hidden block mt-2 bg-amber-50 text-amber-900 hover:bg-amber-100 border border-amber-200 px-6 py-3 rounded-xl text-center font-semibold" href="menu.html" target="_self">Order for this Table</a>
    </div>
  </main>
  <script src="config.js"></script><script src="api.js"></script>
  <script>
    const form = document.getElementById('book-form');
    const errorEl = document.getElementById('book-error');
    const confirmCard = document.getElementById('confirm-card');
    const orderLink = document.getElementById('order-here');
    function toInputDateTime(date) {
      const pad = v => String(v).padStart(2, '0');
      return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()) + 'T' + pad(date.getHours()) + ':' + pad(date.getMinutes());
    }
    const defaultTime = new Date(Date.now() + 30 * 60 * 1000);
    const inputTime = document.getElementById('expectedArrival');
    inputTime.value = toInputDateTime(defaultTime);
    inputTime.min = toInputDateTime(new Date(Date.now() + 60000));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');
      const rawArrival = document.getElementById('expectedArrival').value;
      if (!rawArrival) {
        errorEl.classList.remove('hidden');
        errorEl.textContent = 'Please choose an arrival time.';
        return;
      }
      if (new Date(rawArrival).getTime() < Date.now() - 60000) {
        errorEl.classList.remove('hidden');
        errorEl.textContent = 'Selected time is in the past. Please choose a future date and time.';
        return;
      }
      const payload = {
        guestName: document.getElementById('guestName').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        partySize: Number(document.getElementById('partySize').value),
        tableNumber: document.getElementById('tableNumber').value ? Number(document.getElementById('tableNumber').value) : null,
        expectedArrival: new Date(document.getElementById('expectedArrival').value).toISOString(),
        notes: document.getElementById('notes').value.trim()
      };
      try {
        const r = await CafeApi.post('/bookings', payload);
        if (!r.ok) { throw new Error(r.body?.message || 'Failed'); }
        const code = r.body.booking.code;
        confirmCard.classList.remove('hidden');
        document.getElementById('code-val').textContent = code;
        document.getElementById('code-table').textContent = r.body.booking.tableNumber;
        document.getElementById('code-guest').textContent = r.body.booking.guestName;
        document.getElementById('code-time').textContent = new Date(r.body.booking.expectedArrival).toLocaleString();
        sessionStorage.setItem('booking_code', code);
        sessionStorage.setItem('booking_table', r.body.booking.tableNumber);
        orderLink.href = 'menu.html?code=' + encodeURIComponent(code);
        orderLink.style.display = 'block';
      } catch (err) {
        errorEl.classList.remove('hidden');
        errorEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
