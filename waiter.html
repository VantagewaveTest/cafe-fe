<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Daily Grind Café - Waiter Service Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col justify-between font-sans pt-16">

  <!-- Header -->
  <header class="bg-amber-900 text-amber-100 shadow-md py-4 px-6 flex justify-between items-center fixed top-0 left-0 right-0 z-40">
    <div class="text-xl font-bold tracking-wider flex items-center gap-2">
      <span>🛎️</span> The Daily Grind Café - Waiter Portal
    </div>
    <nav class="space-x-6 text-sm font-medium flex items-center">
      <a href="waiter.html" class="underline underline-offset-4">Table Service Queue</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-8 mb-24">
    
    <!-- Waiter Header & Stats -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 bg-white p-6 rounded-2xl shadow-md border border-amber-200">
      <div>
        <h1 class="text-2xl font-bold text-amber-900 mb-1">Front-of-House Serving Queue</h1>
        <p class="text-xs text-amber-700">Coordinate kitchen readiness and serve prepared meals to customer tables.</p>
      </div>
      <div class="flex gap-4 text-xs font-semibold">
        <div class="bg-emerald-100 text-emerald-900 px-4 py-2 rounded-xl border border-emerald-200">
          Ready to Serve: <span id="stat-ready" class="font-bold text-emerald-950">0</span>
        </div>
      </div>
    </div>

    <!-- Waiter Orders Grid -->
    <div id="waiter-orders-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Loaded dynamically -->
    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-amber-950 text-amber-300/60 py-4 text-center text-xs">
    &copy; 2026 The Daily Grind Café. Waiter Service Portal.
  </footer>

  <script src="app.js"></script>
  <script src="auth.js"></script>
  <script>
    // Ensure only waiters can access this page
    requireRole(['waiter']);

    const API_BASE_URL = 'http://localhost:5001/api';

    async function fetchWaiterOrders() {
      try {
        const res = await fetch(`${API_BASE_URL}/orders`);
        const data = await res.json();
        if (data.success) {
          renderWaiterOrders(data.orders);
        }
      } catch (err) {
        console.error('Failed to load waiter orders:', err);
      }
    }

    function renderWaiterOrders(orders) {
      const grid = document.getElementById('waiter-orders-grid');
      let readyCount = 0;

      orders.forEach(o => {
        if (o.status === 'ready') readyCount++;
      });

      document.getElementById('stat-ready').textContent = readyCount;

      if (orders.length === 0) {
        grid.innerHTML = `<div class="col-span-3 text-center py-12 text-amber-700 bg-white rounded-2xl border border-amber-200">No active orders in service queue.</div>`;
        return;
      }

      grid.innerHTML = orders.map(order => {
        const isReady = order.status === 'ready';
        const isServed = order.status === 'served';

        const statusColor = isServed ? 'bg-blue-100 text-blue-800 border-blue-300' :
                            isReady ? 'bg-emerald-100 text-emerald-800 border-emerald-300 animate-pulse' :
                            'bg-amber-100 text-amber-900 border-amber-200';

        return `
          <div class="bg-white rounded-2xl p-5 shadow-md border border-amber-200 flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-center mb-3">
                <span class="font-bold text-amber-900 text-base">Order #${order.id}</span>
                <span class="text-xs uppercase font-bold px-2.5 py-1 rounded-full border ${statusColor}">${order.status}</span>
              </div>
              <p class="text-xs text-amber-700 mb-3">Total: $${(order.totalAmount || 0).toFixed(2)}</p>
              
              <div class="space-y-2 mb-4 text-xs text-amber-900 bg-amber-50 p-3 rounded-xl border border-amber-100">
                ${order.items.map(i => `
                  <div class="flex justify-between items-center">
                    <span>${i.image || '☕'} ${i.name}</span>
                    <span class="font-bold">x${i.quantity}</span>
                  </div>
                `).join('')}
              </div>
            </div>

            <div>
              <div class="flex gap-2">
                ${isReady ? `
                  <button onclick="updateWaiterStatus('${order.id}', 'served')" class="flex-1 bg-emerald-700 hover:bg-emerald-800 text-white py-2 rounded-xl text-xs font-semibold transition">
                    Mark Served ✓
                  </button>
                ` : isServed ? `
                  <span class="w-full text-center text-xs text-blue-700 font-bold py-2 bg-blue-50 rounded-xl border border-blue-200">
                    Served to Table
                  </span>
                ` : `
                  <span class="w-full text-center text-xs text-amber-700 font-bold py-2 bg-amber-50 rounded-xl border border-amber-200">
                    Kitchen in Progress (${order.status})
                  </span>
                `}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function updateWaiterStatus(orderId, status) {
      try {
        const res = await fetch(`${API_BASE_URL}/orders/${orderId}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        const data = await res.json();
        if (data.success) {
          fetchWaiterOrders();
        } else {
          alert('Failed to update order status');
        }
      } catch (err) {
        console.error('Error updating waiter status:', err);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      fetchWaiterOrders();
      setInterval(fetchWaiterOrders, 5000); // Poll every 5s
    });
  </script>
</body>
</html>
