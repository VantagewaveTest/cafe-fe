<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — The Daily Grind Café</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-amber-900 text-amber-100 shadow-md py-4 px-6 flex justify-between items-center sticky top-0 z-30">
    <div class="flex items-center gap-3">
      <a href="index.html" class="text-sm text-amber-200 hover:text-amber-100 transition">← Back</a>
      <div class="text-xl font-bold">My Orders</div>
    </div>
    <div class="text-xs text-amber-200 bg-amber-800 px-2 py-1 rounded-full">
      Track your orders
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8 space-y-8">

    <section class="space-y-4">
      <h2 class="text-lg font-bold text-amber-900 border-b border-amber-200 pb-2">My Orders</h2>
      <div id="recent-orders" class="space-y-3">
        <!-- Orders will be rendered here with tracking buttons -->
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="bg-amber-950 text-amber-300/60 py-4 text-center text-xs">
    &copy; 2026 The Daily Grind Café. Freshly brewed with love.
  </footer>

  <script>
    const RECENT_ORDERS_EL = document.getElementById('recent-orders');

    function loadRecentOrders() {
      const activeOrder = JSON.parse(localStorage.getItem('active_cafe_order') || 'null');
      RECENT_ORDERS_EL.innerHTML = '';

      if (!activeOrder || !activeOrder.orderId) {
        RECENT_ORDERS_EL.innerHTML = `
          <div class="text-center py-12">
            <div class="text-amber-500 text-sm text-center py-4">No recent orders found.</p>
            <a href="cart.html" class="text-amber-600 text-sm hover:underline mt-2 inline-block">Place an order to start tracking</a>
          </div>
        `;
        return;
      }

      const order = activeOrder;
      const orderCard = document.createElement('div');
      orderCard.className = 'bg-white rounded-xl p-6 border border-amber-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 cursor-pointer hover:bg-amber-50 transition';
      orderCard.onclick = () => trackOrder(order.orderId, order.orderAccessToken);
      orderCard.innerHTML = `
        <div class="flex flex-col gap-2">
          <div class="flex justify-between items-start gap-2">
            <div class="font-bold text-amber-900 text-lg">${order.orderId}</div>
            <span class="text-xs font-semibold bg-amber-100 text-amber-800 px-2 py-1 rounded-full">Active</span>
          </div>
          <div class="text-xs text-amber-600 mb-1">
            Tracking Token: <span class="font-mono text-xs truncate">${order.orderAccessToken ? order.orderAccessToken.substring(0, 12) + '...' : 'N/A'}</span>
          </div>
          <div class="text-xs text-amber-400">Estimated prep: ~${order.totalPrepTime ? Math.ceil(order.totalPrepTime / 60) : '?'} min</div>
        </div>
        <button onclick="event.stopPropagation(); trackOrder('${order.orderId}', '${order.orderAccessToken}')" class="bg-amber-800 hover:bg-amber-900 text-white px-6 py-3 rounded-lg font-semibold transition shadow-md">Track Order</button>
      `;
      RECENT_ORDERS_EL.appendChild(orderCard);
    }

    function trackOrder(orderId, orderToken) {
      sessionStorage.setItem('orderAccessToken', orderToken);
      window.location.href = `order-status.html?orderId=${encodeURIComponent(orderId)}`;
    }

    loadRecentOrders();
  </script>
</body>
</html>
