<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — The Daily Grind Café</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col font-sans">

  <header class="bg-amber-900 text-amber-100 shadow-md py-4 px-6 flex justify-between items-center sticky top-0 z-30">
    <div class="flex items-center gap-3">
      <a href="index.html" class="text-sm text-amber-200 hover:text-amber-100 transition">← Back</a>
      <div class="text-xl font-bold">🛒 My Orders</div>
    </div>
    <div class="text-xs text-amber-200 bg-amber-800 px-2 py-1 rounded-full">
      Live tracking updates
    </div>
  </header>

  <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-8 space-y-8">

    <div id="empty-state" class="text-center py-16">
      <div class="text-4xl mb-4">📭</div>
      <h3 class="text-lg font-bold text-amber-900 mb-2">No recent orders</h3>
      <p class="text-amber-600 text-sm mb-6">Place an order to start tracking.</p>
      <a href="cart.html" class="bg-amber-800 hover:bg-amber-900 text-white px-6 py-3 rounded-lg font-semibold transition inline-block">Place Order</a>
    </div>

    <div id="orders-container" class="hidden space-y-6">
      <div id="orders-list" class="space-y-6">
        <!-- Orders rendered here -->
      </div>
    </div>
  </main>

  <footer class="bg-amber-950 text-amber-300/60 py-4 text-center text-xs">
    &copy; 2026 The Daily Grind Café. Freshly brewed with love.
  </footer>

  <script>
    const STATUS_ORDER_LIST = ['PENDING', 'PREPARING', 'READY', 'PICKED_UP', 'SERVED'];
    const STATUS_LABELS = {
      PENDING: 'Placed',
      PREPARING: 'Preparing',
      READY: 'Ready',
      PICKED_UP: 'Picked Up',
      SERVED: 'Served'
    };
    const STATUS_COLORS = {
      PENDING: 'bg-amber-100 text-amber-900',
      PREPARING: 'bg-violet-100 text-violet-900',
      READY: 'bg-sky-100 text-sky-900',
      PICKED_UP: 'bg-blue-100 text-blue-900',
      SERVED: 'bg-emerald-100 text-emerald-900'
    };
    const STATUS_BADGE_COLORS = {
      PENDING: 'bg-amber-500',
      PREPARING: 'bg-violet-500',
      READY: 'bg-sky-500',
      PICKED_UP: 'bg-blue-500',
      SERVED: 'bg-emerald-500'
    };

    let POLL_TIMER = null;

    function getItemEmoji(name) {
      const nameLower = name.toLowerCase();
      if (nameLower.includes('coffee') || nameLower.includes('espresso') || nameLower.includes('macchiato') || nameLower.includes('cold brew') || nameLower.includes('cappuccino') || nameLower.includes('americano') || nameLower.includes('mocha') || nameLower.includes('ristretto')) return '☕';
      if (nameLower.includes('tea') || nameLower.includes('chai') || nameLower.includes('green tea')) return '🍵';
      if (nameLower.includes('waffle')) return '🧇';
      if (nameLower.includes('cake') || nameLower.includes('velvet') || nameLower.includes('cheesecake') || nameLower.includes('lava')) return '🍰';
      if (nameLower.includes('croissant') || nameLower.includes('cookie') || nameLower.includes('biscotti') || nameLower.includes('tart')) return '🥐';
      if (nameLower.includes('sandwich') || nameLower.includes('wrap')) return '🥪';
      if (nameLower.includes('juice') || nameLower.includes('drink')) return '🥤';
      return '🍽️';
    }

    function getStatusIcon(status) {
      switch(status) {
        case 'PENDING': return '📝';
        case 'PREPARING': return '👨‍🍳';
        case 'READY': return '🍽️';
        case 'PICKED_UP': return '🚚';
        case 'SERVED': return '✅';
        default: return '•';
      }
    }

    function loadOrders() {
      const orders = JSON.parse(localStorage.getItem('all_orders') || '[]');
      const container = document.getElementById('orders-container');
      const emptyState = document.getElementById('empty-state');

      if (!allOrders || allOrders.length === 0) {
        emptyState.classList.remove('hidden');
        container.classList.add('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      container.classList.remove('hidden');

      container.innerHTML = allOrders.map(order => renderOrderCard(order)).join('');

      startPolling();
    }

    function renderOrderCard(order) {
      const status = order.status || 'PENDING';
      const statusColorClass = STATUS_COLORS[status] || 'bg-amber-100 text-amber-900';
      const badgeColorClass = STATUS_BADGE_COLORS[status] || 'bg-amber-500';

      const currentIndex = STATUS_ORDER_LIST.indexOf(status);
      let timelineHtml = '';
      STATUS_ORDER_LIST.forEach((statusItem, idx) => {
        const completed = idx < currentIndex;
        const active = idx === currentIndex;
        const circleClass = completed ? 'bg-emerald-600' : active ? 'bg-amber-600 animate-pulse' : 'bg-amber-200';
        const lineClass = completed ? 'bg-emerald-600' : 'bg-amber-200';
        const labelClass = completed ? 'text-emerald-600 font-semibold' : active ? 'text-amber-900 font-semibold' : 'text-amber-400';

        if (idx > 0) {
          timelineHtml += `<div class="flex-1 h-0.5 ${lineClass} mx-2"></div>`;
        }
        timelineHtml += `
          <div class="flex flex-col items-center">
            <div class="${circleClass} w-3 h-3 rounded-full mx-auto mb-1"></div>
            <span class="text-[10px] ${labelClass}">${STATUS_LABELS[statusItem]}</span>
          </div>
        `;
      });

      return `
        <div class="bg-white rounded-2xl border-2 border-amber-200 shadow-lg p-6 transition-all duration-500 order-card" id="order-${order.orderId}">
          <div class="flex justify-between items-start mb-6 pb-6 border-b border-amber-200">
            <div class="flex items-center gap-2">
              <div class="font-bold text-amber-900 text-lg">Order #${order.orderId}</div>
              <span id="status-pill-${order.orderId}" class="inline-flex items-center gap-2 px-4 py-2 rounded-full font-bold text-sm shadow-sm ${statusColorClass(status)}">
                <span class="w-2.5 h-2.5 rounded-full ${badgeColorClass(status)} animate-pulse"></span>
                <span id="status-text-${order.orderId}" class="font-bold text-sm">${STATUS_LABELS[status] || status}</span>
              </div>
            </div>
            <div class="text-xs text-amber-500 font-mono">Token: <span class="text-amber-700 font-mono">${order.orderAccessToken ? order.orderAccessToken.substring(0, 12) + '...' : 'N/A'}</span></div>
          </div>

          <div class="relative mx-auto max-w-md mb-8">
            <div class="tracking-line" style="position: relative;">
              ${timelineHtml}
              <div id="tracking-char-${order.orderId}" class="tracking-char">🛵</div>
            </div>
          </div>

          <div class="bg-white rounded-xl p-6 border border-amber-200">
            <h3 class="text-sm font-bold text-amber-700 uppercase tracking-wide mb-3">☕ Order Items</h3>
            <div id="order-items-${order.orderId}" class="space-y-2">
              ${(order.items || []).map(item => `
                <div class="flex justify-between items-center py-2 border-b border-amber-50 last:border-0">
                  <div class="flex items-center gap-3">
                    <div class="text-2xl">${getItemEmoji(i.name)}</div>
                    <div class="flex flex-col">
                      <div class="text-sm font-bold text-amber-900">${i.quantity}× ${i.name}</div>
                      <div class="text-xs text-amber-500">${i.category || ''}</div>
                    </div>
                  </div>
                  <span class="font-medium text-amber-900">$${(i.price * i.quantity).toFixed(2)}</span>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4 mt-6">
            <div class="bg-amber-50 rounded-xl p-4 border border-amber-100">
              <div class="text-xs font-bold text-amber-600 uppercase tracking-wide mb-1">🍽️ Table / Counter</div>
              <div class="text-lg font-bold text-amber-900" id="display-table-${order.orderId}">${order.tableNumber || '-'}</div>
            </div>
            <div class="bg-amber-50 rounded-xl p-4 border border-amber-100">
              <div class="text-xs font-bold text-amber-600 uppercase tracking-wide mb-1">💰 Total Amount</div>
              <div class="text-lg font-bold text-amber-900" id="display-total-${order.orderId}">$${order.totalAmount ? order.totalAmount.toFixed(2) : '-'}</div>
            </div>
          </div>

          <div class="mt-6">
            <h3 class="text-sm font-bold text-amber-700 uppercase tracking-wide mb-3">📜 Status History</h3>
            <div id="status-history-${order.orderId}" class="space-y-2">
              ${(order.statusHistory || []).map(h => `
                <div class="flex items-start gap-3">
                  <div class="w-6 h-6 rounded-full bg-amber-200 flex items-center justify-center text-xs font-bold text-amber-600">
                    ${getStatusIcon(h.to)}
                  </div>
                  <div class="flex flex-col">
                    <div class="text-sm font-bold text-amber-900">${STATUS_LABELS[h.to] || h.to}</div>
                    <div class="text-xs text-amber-500">${h.actor || 'system'} • ${new Date(h.at).toLocaleTimeString()}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <div id="celebration-${order.orderId}" class="hidden text-center py-6">
            <div class="text-6xl mb-2">🎉</div>
            <h3 class="text-xl font-bold text-emerald-700 mb-1">Order Served!</h3>
            <p class="text-emerald-600 text-sm">Thank you for dining with us ☕</p>
          </div>
        </div>
      `;
    }

    async function pollOrderStatus() {
      const allOrders = JSON.parse(localStorage.getItem('all_orders') || '[]');
      if (!allOrders || allOrders.length === 0) return;

      for (const order of allOrders) {
        try {
          const res = await CafeApi.get(`/api/orders/${order.orderId}`);
          if (res.ok && res.body.success) {
            const newStatus = res.body.order.status;
            const currentStatus = order.status;

            if (newStatus !== currentStatus) {
              order.status = newStatus;
              order.statusHistory = res.body.order.statusHistory || order.statusHistory;
              localStorage.setItem('all_orders', JSON.stringify(allOrders));
              updateOrderCard(order.orderId, newStatus);
            }
          }
        } catch (_) {
          // Silently fail
        }
      }
    }

    function updateOrderCard(orderId, newStatus) {
      const card = document.getElementById(`order-${orderId}`);
      if (!card) return;

      const statusPill = document.getElementById(`status-pill-${orderId}`);
      const statusText = document.getElementById(`status-text-${orderId}`);

      const statusColors = {
        PENDING: 'bg-amber-100 text-amber-900',
        PREPARING: 'bg-violet-100 text-violet-900',
        READY: 'bg-sky-100 text-sky-900',
        PICKED_UP: 'bg-blue-100 text-blue-900',
        SERVED: 'bg-emerald-100 text-emerald-900'
      };
      const badgeColors = {
        PENDING: 'bg-amber-500',
        PREPARING: 'bg-violet-500',
        READY: 'bg-sky-500',
        PICKED_UP: 'bg-blue-500',
        SERVED: 'bg-emerald-500'
      };

      if (statusPill) {
        statusPill.className = `inline-flex items-center gap-2 px-4 py-2 rounded-full font-bold text-sm shadow-sm ${statusColors[newStatus] || 'bg-amber-100 text-amber-900'}`;
        statusPill.innerHTML = `
          <span class="w-2.5 h-2.5 rounded-full ${badgeColors[newStatus] || 'bg-amber-500'} animate-pulse"></span>
          <span id="status-text-${orderId}" class="font-bold text-sm">${STATUS_LABELS[newStatus] || newStatus}</span>
        `;
      }

      renderTimelineWithOrderId(orderId, newStatus);

      if (newStatus === 'SERVED') {
        const celebration = document.getElementById(`celebration-${orderId}`);
        if (celebration) celebration.classList.remove('hidden');
      }
    }

    function renderTimelineWithOrderId(orderId, currentStatus) {
      const currentIndex = STATUS_ORDER_LIST.indexOf(currentStatus);
      STATUS_ORDER_LIST.forEach((status, idx) => {
        const circle = document.getElementById(`step-${orderId}-${status.toLowerCase()}`);
        if (circle) {
          if (idx < currentIndex) {
            circle.className = 'w-3 h-3 rounded-full bg-emerald-600 mx-auto shadow';
          } else if (idx === currentIndex) {
            circle.className = 'w-3 h-3 rounded-full bg-amber-600 mx-auto shadow animate-pulse';
          } else {
            circle.className = 'w-3 h-3 rounded-full bg-amber-200 mx-auto';
          }
        }
      });
    }

    function startPolling() {
      pollOrderStatus();
      POLL_TIMER = setInterval(() => pollOrderStatus(), POLL_MS || 3000);
    }

    window.addEventListener('beforeunload', () => {
      clearInterval(POLL_TIMER);
    });

    loadOrders();
  </script>
</body>
</html>
