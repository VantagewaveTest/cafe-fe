<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chef Dashboard - The Daily Grind Cafe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-amber-50 text-amber-900 min-h-screen font-sans">
  <header class="bg-amber-900 text-amber-100 border-b border-amber-900 py-4 px-6 flex justify-between items-center sticky top-0 z-30">
    <div class="text-xl font-bold">Chef Dashboard</div>
    <div class="flex items-center gap-4">
      <span id="user-badge" class="text-xs text-amber-200"></span>
      <button id="bell" class="relative bg-amber-600 px-3 py-1 rounded-lg" type="button">     <span id="pending-badge" class="ml-1 inline-block bg-amber-100 text-amber-900 text-xs px-2 py-0.5 rounded-full">0</span></button>
      <button id="logout" class="text-sm text-amber-700 border border-amber-200 px-3 py-1 rounded-lg">Logout</button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto w-full px-4 py-6 space-y-6">
    <section id="login-panel" class="max-w-md mx-auto bg-white border border-amber-200 rounded-2xl p-6 text-center space-y-4">
      <h1 class="text-2xl font-bold">Chef Login</h1>
      <input id="username" class="input w-full px-4 py-2.5 rounded-xl border border-amber-300 bg-amber-50 text-amber-900 placeholder:text-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-amber-500 transition" placeholder="Username (default chef)" />
      <input id="password" class="input w-full px-4 py-2.5 rounded-xl border border-amber-300 bg-amber-50 text-amber-900 placeholder:text-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-amber-500 transition" type="password" placeholder="Password (default chef123)" />
      <button id="login-btn" class="bg-amber-700 hover:bg-amber-800 text-white w-full py-2 rounded-xl font-semibold" type="button">Sign In</button>
      <p class="text-xs text-amber-600">Default: <code>chef / chef123</code></p>
      <p id="login-error" class="text-red-400 text-sm hidden"></p>
    </section>

    <section id="dashboard" class="hidden space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-white rounded-2xl p-4 border border-amber-200">
          <div class="text-xs text-amber-600 uppercase tracking-wide">Pending</div>
          <div id="stat-pending" class="text-3xl font-extrabold">0</div>
        </div>
        <div class="bg-white rounded-2xl p-4 border border-amber-200">
          <div class="text-xs text-amber-600 uppercase tracking-wide">In Progress</div>
          <div id="stat-preparing" class="text-3xl font-extrabold">0</div>
        </div>
        <div class="bg-white rounded-2xl p-4 border border-amber-200">
          <div class="text-xs text-amber-600 uppercase tracking-wide">Ready / Delivered</div>
          <div id="stat-done" class="text-3xl font-extrabold">0</div>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="md:col-span-2 bg-white rounded-2xl p-4 border border-amber-200 space-y-4">
          <h2 class="text-lg font-bold">Kitchen Orders</h2>
          <div class="flex flex-wrap gap-2" id="state-filters">
            <button class="filter bg-amber-700 text-white px-3 py-1 rounded-lg text-sm" data-s="all">All</button>
            <button class="filter bg-amber-100 text-amber-900 px-3 py-1 rounded-lg text-sm" data-s="placed">Pending</button>
            <button class="filter bg-amber-100 text-amber-900 px-3 py-1 rounded-lg text-sm" data-s="preparing">Preparing</button>
            <button class="filter bg-amber-100 text-amber-900 px-3 py-1 rounded-lg text-sm" data-s="ready">Ready</button>
          </div>
          <div id="orders-list" class="space-y-3"></div>
        </div>
        <div class="bg-white rounded-2xl p-4 border border-amber-200 space-y-4">
          <h2 class="text-lg font-bold">Low/Out of Stock (Chef)</h2>
          <div id="inventory-list" class="space-y-2 text-sm"></div>
          <h2 class="text-lg font-bold pt-4 border-t border-amber-200">Table Occupancy</h2>
          <div id="table-list" class="grid grid-cols-4 gap-2 text-sm"></div>
        </div>
      </div>
    </section>
  </main>

    <script src="config.js"></script><script src="api.js"></script>
  <script>
    const LoginPanel = document.getElementById('login-panel');
    const Dashboard = document.getElementById('dashboard');
    const OrdersList = document.getElementById('orders-list');
    const PendingBadge = document.getElementById('pending-badge');
    const BellBtn = document.getElementById('bell');
    const InventoryList = document.getElementById('inventory-list');
    const TableList = document.getElementById('table-list');
    /* Pending orders badge only; no sound alert. */
    let Filter = 'all';
    let Poller = null;
    function token() { return sessionStorage.getItem('chefToken'); }

    function actionBtn(order, label, target, color = 'bg-amber-700 hover:bg-amber-800') {
      return `<button class="${color} text-white text-xs px-3 py-1.5 rounded-lg font-medium" data-order="${order.orderId}" data-status="${target}">${label}</button>`;
    }

    async function api(path, body = null, method = 'GET') {
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      opts.headers.Authorization = 'Bearer ' + token();
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(window.API_BASE + path, opts);
      let json = {};
      try { json = await res.json(); } catch (_) {}
      return { status: res.status, ok: res.ok, body: json };
    }

    function statusColor(s) {
      if (s === 'delivered') return 'bg-emerald-600';
      if (s === 'ready') return 'bg-sky-600';
      if (s === 'preparing') return 'bg-violet-600';
      if (s === 'placed') return 'bg-amber-700';
      if (s === 'cancelled' || s === 'rejected') return 'bg-red-600';
      return 'bg-amber-200';
    }

    function formatTime(iso) {
      try { return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); } catch (_) { return '--'; }
    }

    
function maybeShowStockWarnings(inventory) {
  InventoryList.innerHTML = '';
  const warnings = inventory.warnings || (inventory.items || []).filter(item => item.warning || item.stock === 0);
  if (!warnings.length) {
    InventoryList.innerHTML = `
      <div class="bg-amber-100 border border-amber-200 text-amber-900 rounded-xl p-3 text-sm font-medium">
        All menu items are in stock.
      </div>`;
  } else {
    warnings.forEach(item => {
      const out = item.stock === 0;
      const badge = out ? 'Out of stock' : (item.stock + ' left');
      const stockClass = out ? 'bg-red-600 text-white' : 'bg-amber-700 text-white';
      const card = document.createElement('div');
      card.className = 'bg-white rounded-2xl p-4 shadow-sm border border-amber-200 space-y-3';
      card.innerHTML = `
        <div class="flex justify-between items-start gap-2">
          <div class="flex items-start gap-2">
            <div class="text-3xl leading-none">${item.image || '🍽'}</div>
            <div>
              <h4 class="font-bold text-amber-900">${item.name}</h4>
              <p class="text-xs text-amber-700">${item.category || ''} • ${item.prepTime || 0}s prep</p>
            </div>
          </div>
          <span class="text-xs font-bold px-2 py-1 rounded-full ${stockClass}">${badge}</span>
        </div>
        <p class="text-xs text-amber-800">${item.description || ''}</p>
        <div class="flex justify-between items-center text-xs border-t border-amber-100 pt-2">
          <span class="font-semibold text-amber-900">${item.price ? ('Rs ' + Number(item.price).toFixed(2)) : ''}</span>
          <span class="font-semibold ${out ? 'text-red-600' : 'text-amber-700'}">${item.stock} left</span>
        </div>
        <button type="button" onclick="restockItem('${item.id}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-xl text-sm font-semibold">
          Add +10 stock
        </button>`;
      InventoryList.appendChild(card);
    });
  }
}

async function restockItem(id) {
  try {
    const res = await api('/chef/inventory/' + encodeURIComponent(id) + '/restock', { amount: 10 }, 'POST');
    if (!res.ok) silentAlert(res.body?.message || 'Restock failed');
    fetchAll();
  } catch (_) {
    silentAlert('Network error. Is cafe-be running?');
  }
}


function updateTableMap(orders) {
      const seen = new Map();
      for (const o of orders) {
        const t = o.tableNumber || 'Walk-in';
        if (!seen.has(t)) seen.set(t, { status: 'empty', count: 0, orderIds: [] });
        const s = seen.get(t);
        s.count += 1; s.orderIds.push(o.orderId);
        if (['placed', 'preparing', 'ready'].includes(o.status)) s.status = 'occupied';
        if (o.status === 'delivered') s.status = 'cleaning';
      }
      TableList.innerHTML = '';
      for (const [table, slot] of seen.entries()) {
        const card = document.createElement('div');
        card.className = 'rounded-lg border border-amber-200 p-2 text-center ' + (slot.status === 'occupied' ? 'bg-amber-800' : slot.status === 'cleaning' ? 'bg-amber-200' : 'bg-amber-200');
        card.innerHTML = `<div class="text-xs text-amber-200">${table}</div><div class="font-bold text-xs">${slot.count}</div>`;
        TableList.appendChild(card);
      }
      if (!seen.size) TableList.innerHTML = '<p class="text-xs text-amber-500">No tables activity.</p>';
    }

    function renderOrders(orders) {
      const pending = orders.filter(o => o.status === 'placed');
      const preparingCount = orders.filter(o => o.status === 'preparing').length;
      const done = orders.filter(o => ['ready', 'delivered'].includes(o.status)).length;
      document.getElementById('stat-pending').textContent = pending.length;
      document.getElementById('stat-preparing').textContent = preparingCount;
      document.getElementById('stat-done').textContent = done;

      PendingBadge.textContent = String(pending.length);

      PendingBadge.textContent = String(pending.length);

      OrdersList.innerHTML = '';
      const filtered = Filter === 'all' ? orders : orders.filter(o => o.status === Filter);
      filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).forEach(o => {
        const overdue = o.status === 'placed' && (Date.now() - new Date(o.createdAt).getTime()) > 180000;
        const card = document.createElement('div');
        card.className = 'bg-amber-50 rounded-xl p-4 border border-amber-200 space-y-2 ' + (overdue ? 'border-red-500' : '');
        card.innerHTML = `
          <div class="flex justify-between items-center">
            <div>
              <div class="font-bold">${o.orderId} - Table ${o.tableNumber || 'walk-in'}</div>
              <div class="text-xs text-amber-200">${o.guestName || 'Guest'}     ${o.partySize || 0} pax     ${formatTime(o.createdAt)}</div>
            </div>
            <span class="text-xs font-bold px-2 py-1 rounded-full text-white ${statusColor(o.status)}">${o.status}</span>
          </div>
          <div class="text-sm text-amber-800">${o.items.map(i => i.quantity + '  - ' + i.name).join(', ')}</div>
          <div class="text-xs text-amber-600">Prep ${o.totalPrepTime}s - ETA ${o.expectedDeliveredAt ? formatTime(o.expectedDeliveredAt) : '--'}</div>
          <div class="flex flex-wrap gap-2">
            ${o.status === 'placed' ? actionBtn(o, 'Reject', 'reject', 'bg-red-700 hover:bg-red-800') : ''}
            ${o.status === 'placed' ? actionBtn(o, 'Start Prep', 'preparing', 'bg-violet-600 hover:bg-violet-700') : ''}
            ${o.status === 'preparing' ? actionBtn(o, 'Mark Ready', 'ready', 'bg-sky-600 hover:bg-sky-700') : ''}
            ${o.status === 'ready' ? actionBtn(o, 'Send to Table', 'delivered', 'bg-emerald-600 hover:bg-emerald-700') : ''}
            <button class="action print-receipt bg-amber-100 hover:bg-amber-200 text-amber-900 border border-amber-200 text-xs px-3 py-1.5 rounded-lg" data-order="${o.orderId}">Print receipt</button>
          </div>
          ${o.status === 'rejected' ? `<div class="text-red-400 text-xs">Rejected: ${o.rejectionReason || 'no reason'}</div>` : ''}
          ${overdue ? '<div class="text-red-600 text-xs">Order idle > 3 min</div>' : ''}
        `;
        OrdersList.appendChild(card);
      });
      if (!filtered.length) OrdersList.innerHTML = '<p class="text-amber-600 text-sm">No orders in this filter.</p>';
      updateTableMap(orders);
    }

    async function fetchAll() {
      try {
        const r = await api('/chef/orders');
        if (r.status === 401) { logout(true); return; }
        if (r.ok) renderOrders(r.body.orders || []);
        const inv = await api('/chef/inventory');
        if (inv.ok) maybeShowStockWarnings(inv.body);
      } catch (e) {
        if (!OrdersList.querySelector('.error-banner')) {
          const b = document.createElement('div'); b.className = 'error-banner bg-red-700 text-white rounded-xl p-3 text-sm'; b.textContent = 'Network error. Retrying   '; OrdersList.prepend(b);
        }
      }
    }

async function advance(orderId, status) {
      const r = await api('/chef/orders/' + orderId + '/status', { status }, 'PATCH');
      if (!r.ok) { silentAlert(r.body?.message || 'Action failed'); return; }
      fetchAll();
    }

    async function reject(orderId) {
      const reason = await window.silentPrompt('Rejection reason (required):');
      if (!reason) return;
      const r = await api('/chef/orders/' + orderId + '/reject', { reason }, 'POST');
      if (!r.ok) { silentAlert(r.body?.message || 'Reject failed'); return; }
      fetchAll();
    }

    // login
    document.getElementById('login-btn').addEventListener('click', async () => {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      const btn = document.getElementById('login-btn');
      const err = document.getElementById('login-error');
      err.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Signing in...';
            try {
        const r = await fetch(window.API_BASE + '/chef/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) {
          err.textContent = j.message || 'Login failed - use chef / chef123';
          err.classList.remove('hidden');
          return;
        }
        if (!j.token) { throw new Error('No token returned by server'); }
        sessionStorage.setItem('chefToken', j.token);
        sessionStorage.setItem('chefUser', u || 'chef');
        showDashboard();
      } catch (e) {
        err.textContent = (e && e.message) ? e.message : 'Network error - start cafe-be on port 5000 and retry';
        err.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
    document.getElementById('username').addEventListener('keyup', e => { if (e.key === 'Enter') document.getElementById('login-btn').click(); });
    document.getElementById('password').addEventListener('keyup', e => { if (e.key === 'Enter') document.getElementById('login-btn').click(); });
    document.getElementById('logout').addEventListener('click', () => { sessionStorage.clear(); window.location.reload(); });

    function showDashboard() {
      LoginPanel.classList.add('hidden');
      Dashboard.classList.remove('hidden');
      document.getElementById('user-badge').textContent = sessionStorage.getItem('chefUser') || 'chef';
      fetchAll();
      Poller = setInterval(fetchAll, 3000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { if (Poller) clearInterval(Poller); } else { fetchAll(); Poller = setInterval(fetchAll, 3000); }
      });
    }

    if (token()) showDashboard();

    OrdersList.addEventListener('click', e => {
      const el = e.target;
      if (el.dataset && el.dataset.order) {
        const status = el.dataset.status;
        if (status === 'reject') reject(el.dataset.order);
        else advance(el.dataset.order, status);
      }
      if (el.classList.contains('print-receipt')) {
        const orderId = el.dataset.order;
        window.open(window.API_BASE + '/orders/' + orderId + '/receipt', '_blank');
      }
    });
    // filter bar handlers
    document.getElementById('state-filters').addEventListener('click', e => {
      if (e.target.dataset && e.target.dataset.s) {
        Filter = e.target.dataset.s;
        document.querySelectorAll('.filter').forEach(b => b.className = (b.dataset.s === Filter ? 'filter bg-amber-700 text-white px-3 py-1 rounded-lg text-sm' : 'filter bg-amber-100 text-amber-900 px-3 py-1 rounded-lg text-sm'));
        fetchAll();
      }
    });
    BellBtn.addEventListener('click', () => { BellBtn.classList.add('animate-pulse'); setTimeout(() => BellBtn.classList.remove('animate-pulse'), 500); });

    function logout(silent = false) {
      sessionStorage.clear();
      if (Poller) clearInterval(Poller);
      Dashboard.classList.add('hidden'); LoginPanel.classList.remove('hidden');
    }

    function actionBtn(order, label, target, color) {
      return `<button class="${color} text-white text-xs px-3 py-1.5 rounded-lg font-medium" data-order="${order.orderId}" data-status="${target}">${label}</button>`;
    }
  </script>
</body>
</html>
