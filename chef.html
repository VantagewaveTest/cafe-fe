<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chef Dashboard — The Daily Grind Café</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 min-h-screen font-sans">

  <!-- Header -->
  <header class="bg-amber-900 text-amber-100 shadow-md py-4 px-6 flex justify-between items-center sticky top-0 z-30">
    <div class="flex items-center gap-3">
      <a href="index.html" class="text-sm text-amber-200 hover:text-amber-100 transition">← Back</a>
      <div class="text-xl font-bold">Chef Dashboard</div>
    </div>
    <div class="flex items-center gap-4">
      <span id="user-badge" class="text-xs text-amber-200 bg-amber-800 px-2 py-1 rounded-full"></span>
      <button id="logout-btn" class="text-sm text-amber-200 hover:text-amber-100 transition underline">Logout</button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto w-full px-4 py-6 space-y-6">
    <!-- Status Counts -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white rounded-2xl p-4 border border-amber-200">
        <div class="text-xs text-amber-600 uppercase tracking-wide mb-1">Pending</div>
        <div id="stat-pending" class="text-2xl font-extrabold text-amber-900">0</div>
      </div>
      <div class="bg-white rounded-2xl p-4 border border-amber-200">
        <div class="text-xs text-amber-600 uppercase tracking-wide mb-1">Preparing</div>
        <div id="stat-preparing" class="text-2xl font-extrabold text-amber-900">0</div>
      </div>
      <div class="bg-white rounded-2xl p-4 border border-amber-200">
        <div class="text-xs text-amber-600 uppercase tracking-wide mb-1">Ready</div>
        <div id="stat-ready" class="text-2xl font-extrabold text-amber-900">0</div>
      </div>
    </div>

    <!-- Kitchen Queue -->
    <div class="bg-white rounded-2xl p-6 border border-amber-200 space-y-4">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-amber-900">Kitchen Ticket Queue (FIFO)</h2>
        <span class="text-xs text-amber-500">Auto-updates every 3 seconds</span>
      </div>

      <div id="queue-empty" class="hidden text-center py-8">
        <p class="text-amber-500 text-sm">No pending tickets.</p>
      </div>

      <div id="pending-queue" class="space-y-3">
        <!-- Pending tickets rendered here -->
      </div>

      <div id="preparing-section" class="mt-6">
        <h3 class="text-xs font-bold text-amber-600 uppercase tracking-wide mb-3">Concurrently Preparing</h3>
        <div id="preparing-queue" class="space-y-3">
          <!-- Preparing tickets rendered here -->
        </div>
      </div>
    </div>

    <!-- Chef Actions -->
    <div id="chef-actions" class="bg-white rounded-2xl p-6 border border-amber-200 space-y-4 hidden">
      <h3 class="text-lg font-bold text-amber-900">Ticket Actions</h3>
      <div class="space-y-3" id="actions-list">
        <!-- Action buttons rendered here -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-amber-950 text-amber-300/60 py-4 text-center text-xs">
    &copy; 2026 The Daily Grind Café. Freshly brewed with love.
  </footer>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    const role = sessionStorage.getItem('staffRole');
    const token = sessionStorage.getItem('staffToken');

    if (!token || role !== 'CHEF') {
      window.location.href = 'staff-login.html';
    }

    document.getElementById('user-badge').textContent = `CHEF · ${sessionStorage.getItem('staffUsername')}`;
    document.getElementById('logout-btn').addEventListener('click', () => {
      sessionStorage.clear();
      window.location.href = 'index.html';
    });

    let pollTimer = null;

    async function fetchQueue() {
      const res = await CafeApi.get('/chef/queue');
      if (!res.ok) {
        if (res.status === 401) {
          sessionStorage.clear();
          window.location.href = 'staff-login.html';
        }
        return;
      }

      const { queue, preparing, ready, counts } = res.body;

      // Update counts
      document.getElementById('stat-pending').textContent = counts.pending;
      document.getElementById('stat-preparing').textContent = counts.preparing;
      document.getElementById('stat-ready').textContent = counts.ready;

      // Render pending queue (FIFO - oldest first)
      const pendingEl = document.getElementById('pending-queue');
      const emptyEl = document.getElementById('queue-empty');

      if (queue.length === 0) {
        pendingEl.innerHTML = '';
        emptyEl.classList.remove('hidden');
      } else {
        emptyEl.classList.add('hidden');
        pendingEl.innerHTML = queue.map(order => `
          <div class="bg-amber-50 rounded-xl p-4 border border-amber-200 flex justify-between items-center">
            <div>
              <div class="font-bold text-amber-900">${order.orderId}</div>
              <div class="text-xs text-amber-600">${order.tableNumber || 'Counter'} • ${order.items.map(i => i.quantity + '× ' + i.name).join(', ')}</div>
              <div class="text-xs text-amber-500">Placed ${new Date(order.createdAt).toLocaleTimeString()}</div>
            </div>
            <button onclick="startPrep('${order.orderId}')" class="bg-violet-600 hover:bg-violet-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
              Start Prep
            </button>
          </div>
        `).join('');
      }

      // Render preparing queue (concurrent)
      const preparingEl = document.getElementById('preparing-queue');
      if (preparing.length === 0) {
        preparingEl.innerHTML = '<p class="text-amber-500 text-xs text-center py-4">No tickets currently preparing.</p>';
      } else {
        preparingEl.innerHTML = preparing.map(order => `
          <div class="bg-blue-50 rounded-xl p-4 border border-blue-200 flex justify-between items-center">
            <div>
              <div class="font-bold text-amber-900">${order.orderId}</div>
              <div class="text-xs text-amber-600">${order.items.map(i => i.quantity + '× ' + i.name).join(', ')}</div>
            </div>
            <button onclick="markReady('${order.orderId}')" class="bg-sky-600 hover:bg-sky-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
              Mark Ready
            </button>
          </div>
        `).join('');
      }
    }

    async function startPrep(orderId) {
      const res = await CafeApi.patch(`/chef/orders/${orderId}/status`, { status: 'PREPARING', reason: 'chef started prep' });
      if (res.ok) {
        fetchQueue();
      } else {
        alert(res.body.message || 'Failed to start prep');
      }
    }

    async function markReady(orderId) {
      const res = await CafeApi.patch(`/chef/orders/${orderId}/status`, { status: 'READY', reason: 'chef marked ready' });
      if (res.ok) {
        fetchQueue();
      } else {
        alert(res.body.message || 'Failed to mark ready');
      }
    }

    // Poll every POLL_MS
    fetchQueue();
    pollTimer = setInterval(fetchQueue, POLL_MS);

    // Refresh on visibility change
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) fetchQueue();
    });
  </script>
</body>
</html>
