<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Daily Grind Café - Kitchen</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col font-sans">

  <header class="bg-amber-900 text-amber-100 shadow-md py-4 px-6 flex justify-between items-center">
    <div class="text-2xl font-bold tracking-wider flex items-center gap-2">
      <span>🍳</span> Kitchen — <span id="who" class="font-normal text-amber-200"></span>
    </div>
    <nav class="space-x-6 text-sm font-medium flex items-center">
      <a href="#queue" class="hover:text-amber-300 transition">Queue</a>
      <a href="#history" class="hover:text-amber-300 transition">History</a>
      <button onclick="logout()" class="bg-amber-700 hover:bg-amber-800 px-4 py-1.5 rounded-lg">Logout</button>
    </nav>
  </header>

  <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-6 pb-16">
    <div id="auth-error" class="hidden mb-6 text-center text-amber-900 bg-red-50 border border-red-300 rounded-xl px-4 py-3"></div>

    <div id="content" class="hidden">
      <!-- Counts -->
      <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="bg-white rounded-2xl p-4 shadow-md border border-amber-200 text-center">
          <div class="text-3xl font-bold text-amber-800" id="count-pending">0</div>
          <div class="text-xs uppercase tracking-wide text-amber-600 font-bold">Pending (FIFO)</div>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-md border border-amber-200 text-center">
          <div class="text-3xl font-bold text-amber-600" id="count-preparing">0</div>
          <div class="text-xs uppercase tracking-wide text-amber-600 font-bold">Preparing</div>
        </div>
      </div>

      <!-- Pending queue -->
      <section id="queue" class="mb-8">
        <h2 class="text-xl font-bold text-amber-900 mb-3">Pending Queue (oldest first)</h2>
        <div id="pending-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </section>

      <!-- Preparing -->
      <section class="mb-8">
        <h2 class="text-xl font-bold text-amber-900 mb-3">Preparing</h2>
        <div id="preparing-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </section>

      <!-- History + stats -->
      <section id="history" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-white rounded-2xl p-5 shadow-md border border-amber-200">
          <div class="flex justify-between items-center mb-3">
            <h2 class="text-lg font-bold text-amber-900">Prep History</h2>
            <input type="date" id="hist-date" onchange="loadHistory()" class="border border-amber-300 rounded-lg px-2 py-1 text-sm">
          </div>
          <ul id="history-list" class="space-y-2 text-sm text-amber-800 max-h-64 overflow-y-auto"></ul>
        </div>
        <div class="bg-white rounded-2xl p-5 shadow-md border border-amber-200">
          <div class="flex justify-between items-center mb-3">
            <h2 class="text-lg font-bold text-amber-900">Top Prepared</h2>
            <input type="date" id="stats-date" onchange="loadStats()" class="border border-amber-300 rounded-lg px-2 py-1 text-sm">
          </div>
          <ul id="stats-list" class="space-y-2 text-sm text-amber-800 max-h-64 overflow-y-auto"></ul>
        </div>
      </section>
    </div>
  </main>

  <footer class="bg-amber-950 text-amber-300/60 py-4 text-center text-xs mt-auto">
    &copy; 2026 The Daily Grind Café. Freshly brewed with love.
  </footer>

  <script src="app.js"></script>
  <script>
    const POLL_MS = 3000;
    let staff = null;

    function logout() { localStorage.removeItem('cafe_staff'); window.location.href = 'login.html'; }

    function requireAuth() {
      const raw = localStorage.getItem('cafe_staff');
      if (!raw) { window.location.href = 'login.html'; return null; }
      const s = JSON.parse(raw);
      if (s.expiresAt && Date.now() > s.expiresAt) {
        localStorage.removeItem('cafe_staff');
        window.location.href = 'login.html?expired=1';
        return null;
      }
      return s;
    }

    function showAuthError(msg) {
      const el = document.getElementById('auth-error');
      el.textContent = msg;
      el.classList.remove('hidden');
      document.getElementById('content').classList.add('hidden');
    }

    async function api(method, path) {
      const res = await fetch(`${API_BASE}${path}`, {
        method,
        headers: { 'Authorization': `Bearer ${staff.token}` }
      });
      if (res.status === 401 || res.status === 403) {
        logout();
        throw new Error('Session invalid or insufficient role.');
      }
      const data = await res.json();
      return { res, data };
    }

    function itemLines(items) {
      return (items || []).map(i => `<li>${i.quantity} × ${i.name}</li>`).join('');
    }

    function renderQueue(data) {
      document.getElementById('count-pending').textContent = data.counts.PENDING;
      document.getElementById('count-preparing').textContent = data.counts.PREPARING;

      const pending = document.getElementById('pending-list');
      pending.innerHTML = data.queue.length ? data.queue.map(o => `
        <div class="bg-white rounded-2xl p-4 shadow-md border border-amber-200">
          <div class="flex justify-between items-center mb-2">
            <span class="font-bold text-amber-900">#${o.orderId}</span>
            <span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-semibold">${o.fulfillment === 'counter' ? 'Counter' : 'Table ' + (o.tableNumber || '')}</span>
          </div>
          <ul class="text-sm text-amber-800 mb-3 list-disc list-inside">${itemLines(o.items)}</ul>
          <div class="flex justify-between items-center">
            <span class="text-xs text-amber-600">⏱️ ~${o.estimatedPrepTime}s</span>
            <button onclick="act('${o.orderId}','start')" class="bg-amber-800 hover:bg-amber-900 text-white text-xs px-4 py-1.5 rounded-lg font-medium">Start Preparing</button>
          </div>
        </div>`).join('')
        : `<p class="text-amber-600 text-sm">No pending tickets. 🎉</p>`;

      const prep = document.getElementById('preparing-list');
      prep.innerHTML = data.preparing.length ? data.preparing.map(o => `
        <div class="bg-amber-50 rounded-2xl p-4 shadow-md border border-amber-300">
          <div class="flex justify-between items-center mb-2">
            <span class="font-bold text-amber-900">#${o.orderId}</span>
            <span class="text-xs bg-amber-500 text-white px-2 py-0.5 rounded-full font-semibold">Preparing</span>
          </div>
          <ul class="text-sm text-amber-800 mb-3 list-disc list-inside">${itemLines(o.items)}</ul>
          <div class="flex justify-end">
            <button onclick="act('${o.orderId}','ready')" class="bg-emerald-700 hover:bg-emerald-800 text-white text-xs px-4 py-1.5 rounded-lg font-medium">Mark Ready</button>
          </div>
        </div>`).join('')
        : `<p class="text-amber-600 text-sm">Nothing in preparation.</p>`;
    }

    async function act(id, action) {
      try {
        const { res, data } = await api('PATCH', `/kitchen/orders/${id}/${action}`);
        if (!res.ok) { alert(data.message || 'Action failed (' + res.status + ')'); }
        refresh();
        loadHistory();
        loadStats();
      } catch (e) { console.error(e); }
    }

    async function refresh() {
      try {
        const { data } = await api('GET', '/kitchen/queue');
        renderQueue(data);
      } catch (e) { console.error(e); }
    }

    async function loadHistory() {
      const d = document.getElementById('hist-date').value;
      try {
        const { data } = await api('GET', `/kitchen/history${d ? '?date=' + d : ''}`);
        document.getElementById('history-list').innerHTML = data.history.length
          ? data.history.map(o => `<li class="flex justify-between border-b border-amber-100 pb-1"><span>#${o.orderId}</span><span class="text-amber-600">${new Date(o.createdAt).toLocaleString()}</span></li>`).join('')
          : `<li class="text-amber-600">No history for this date.</li>`;
      } catch (e) { console.error(e); }
    }

    async function loadStats() {
      const d = document.getElementById('stats-date').value;
      try {
        const { data } = await api('GET', `/stats/top-prepared${d ? '?date=' + d : ''}`);
        document.getElementById('stats-list').innerHTML = data.topPrepared.length
          ? data.topPrepared.map(i => `<li class="flex justify-between border-b border-amber-100 pb-1"><span>${i.name}</span><span class="font-bold text-amber-800">${i.quantity}</span></li>`).join('')
          : `<li class="text-amber-600">No completed items for this date.</li>`;
      } catch (e) { console.error(e); }
    }

    window.addEventListener('DOMContentLoaded', () => {
      staff = requireAuth();
      if (!staff) return;
      if (staff.role !== 'CHEF') { showAuthError('This dashboard is for CHEF staff only. You are signed in as ' + staff.role + '.'); return; }
      document.getElementById('content').classList.remove('hidden');
      document.getElementById('who').textContent = staff.username;
      refresh(); loadHistory(); loadStats();
      setInterval(refresh, POLL_MS);
    });
  </script>
</body>
</html>
